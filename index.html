<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 智能选餐</title>
<style>
  :root {
    --accent: #ea580c;
    --accent-dark: #c2410c;
    --ink: #1c1917;
    --muted: #78716c;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #fff7ed 0%, #ffedd5 45%, #fef3c7 100%);
    min-height: 100vh;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  .wrap { width: 100%; max-width: 560px; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 28px; letter-spacing: 1px; }
  .sub { color: var(--muted); margin-top: 8px; font-size: 14px; line-height: 1.6; }
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(234, 88, 12, .12);
    padding: 20px;
    margin-bottom: 20px;
  }
  textarea {
    width: 100%;
    border: 2px solid #fde2c8;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
    min-height: 84px;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
  .chip {
    border: 1px solid #fdba74;
    background: #fff7ed;
    color: var(--accent-dark);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .chip:hover { background: #ffedd5; }
  .btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #f97316);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .btn:hover { opacity: .92; }
  .btn:active { transform: scale(.99); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .hidden { display: none !important; }
  .loading { text-align: center; padding: 32px 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
  .spinner {
    width: 36px; height: 36px;
    margin: 0 auto 14px;
    border: 4px solid #fed7aa;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thinking-head {
    font-size: 13px;
    color: var(--muted);
    margin: 0 4px 8px;
    display: flex;
    justify-content: space-between;
  }
  .thinking-text {
    background: #292524;
    color: #e7e5e4;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    max-height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .results-head { font-size: 15px; color: var(--muted); margin: 0 4px 12px; }
  .dish {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(28, 25, 23, .08);
    padding: 16px 18px;
    margin-bottom: 14px;
    animation: rise .3s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .dish-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .dish-head h3 { font-size: 18px; }
  .cat {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--accent-dark);
    background: #ffedd5;
    border-radius: 6px;
    padding: 3px 8px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 12px; border-radius: 6px; padding: 3px 8px; }
  .tag.辣 { background: #fee2e2; color: #dc2626; }
  .tag.酸 { background: #ecfccb; color: #4d7c0f; }
  .tag.甜 { background: #fce7f3; color: #db2777; }
  .tag.苦 { background: #e7e5e4; color: #57534e; }
  .ing { margin-top: 10px; font-size: 13px; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>🍜 AI 智能选餐</h1>
    <p class="sub">用一句话告诉 AI 你想吃什么，它从本地菜品库帮你挑<br>全程本地运行，数据不出本机</p>
  </header>

  <section class="card">
    <textarea id="query" placeholder="例如：想吃点辣的，不要猪肉，来两道菜"></textarea>
    <div class="chips">
      <button class="chip" data-q="想吃点辣的，不要猪肉，来两道菜">🌶️ 辣的，不要猪肉</button>
      <button class="chip" data-q="口味清淡点，来两道素菜和一个汤">🥬 清淡素菜 + 汤</button>
      <button class="chip" data-q="来点酸的开开胃">🍋 酸的开胃菜</button>
      <button class="chip" data-q="想吃甜口的荤菜，来一道">🍖 甜口荤菜</button>
    </div>
    <button id="go" class="btn">AI 帮我选</button>
  </section>

  <section id="loading" class="loading hidden">
    <div class="spinner"></div>
    AI 正在为你挑选菜品…<br>
    <small>首次调用需要加载模型，可能要等十几秒</small>
  </section>

  <section id="thinking" class="hidden">
    <p class="thinking-head">AI 思考过程<span id="retry-note"></span></p>
    <pre id="thinking-text" class="thinking-text"></pre>
  </section>

  <section id="error" class="error hidden"></section>

  <section id="results" class="hidden"></section>

  <footer>本地 Ollama 推理 · 无外部 API · 数据不出本机</footer>
</main>

<script>
  const input = document.getElementById('query');
  const goBtn = document.getElementById('go');
  const loading = document.getElementById('loading');
  const errorBox = document.getElementById('error');
  const results = document.getElementById('results');
  const thinking = document.getElementById('thinking');
  const thinkingText = document.getElementById('thinking-text');
  const retryNote = document.getElementById('retry-note');

  // 转义 HTML，防止用户/AI 内容被当作 HTML 注入
  function escapeHTML(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // 点击快捷示例，填入输入框
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.dataset.q;
      input.focus();
    });
  });

  // 输入框内按 Enter 直接提交（Shift+Enter 换行）
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      recommend();
    }
  });
  goBtn.addEventListener('click', recommend);

  function setLoading(on) {
    goBtn.disabled = on;
    loading.classList.toggle('hidden', !on);
    if (on) {
      errorBox.classList.add('hidden');
      results.classList.add('hidden');
      thinking.classList.add('hidden');
      thinkingText.textContent = '';
      retryNote.textContent = '';
    }
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
  }

  // 渲染推荐结果：菜名 + 类别 + 口味标签 + 食材
  function render(dishes) {
    const tags = d => (d.tastes || []).map(t =>
      `<span class="tag ${escapeHTML(t)}">${escapeHTML(t)}</span>`).join('');
    results.innerHTML =
      `<p class="results-head">为你挑好了 ${dishes.length} 道菜：</p>` +
      dishes.map(d => `
        <article class="dish">
          <div class="dish-head">
            <h3>${escapeHTML(d.name)}</h3>
            <span class="cat">${escapeHTML(d.category)}</span>
          </div>
          <div class="tags">${tags(d)}</div>
          <p class="ing">主要食材：${escapeHTML((d.ingredients || []).join('、'))}</p>
        </article>`).join('');
    results.classList.remove('hidden');
  }

  // 解析一段 SSE 事件文本："event: token\ndata: {...}"
  function parseSSE(raw) {
    let event = 'message';
    let data = '';
    for (const line of raw.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    try { return { event, data: data ? JSON.parse(data) : null }; }
    catch (e) { return { event, data: null }; }
  }

  // 调用后端流式推荐接口（SSE）：
  // 用 fetch + ReadableStream 边收边渲染，实时展示模型生成过程，
  // 收到 result 事件后渲染菜品卡片（原生 EventSource 只支持 GET，故不用它）。
  async function recommend() {
    const query = input.value.trim();
    if (!query) {
      showError('先输入你的用餐需求吧～例如：想吃点辣的，不要猪肉，来两道菜');
      return;
    }
    setLoading(true);
    try {
      const resp = await fetch('/api/recommend/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      if (!resp.ok || !resp.body) {
        let msg = '后端连接失败，请确认 `go run main.go` 正在运行';
        try { msg = (await resp.json()).error || msg; } catch (e) {}
        throw new Error(msg);
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';
      let streamError = null;
      let finished = false;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        // SSE 事件之间以空行分隔
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const { event, data } = parseSSE(buf.slice(0, idx));
          buf = buf.slice(idx + 2);
          if (event === 'token' && data && data.text) {
            // 首个 token 到达：收起 loading，展示实时生成内容
            loading.classList.add('hidden');
            thinking.classList.remove('hidden');
            thinkingText.textContent += data.text;
            thinkingText.scrollTop = thinkingText.scrollHeight;
          } else if (event === 'status' && data) {
            // 工具调用等过程状态也写进“思考过程”框，便于观察 AI 行为
            retryNote.textContent = '（' + data.message + '）';
            loading.classList.add('hidden');
            thinking.classList.remove('hidden');
            thinkingText.textContent += '\n[' + data.message + ']\n';
            thinkingText.scrollTop = thinkingText.scrollHeight;
          } else if (event === 'result' && data) {
            finished = true;
            render(data.dishes);
          } else if (event === 'error' && data) {
            streamError = data.error || 'AI 暂时没想好，请换个说法试试';
          }
        }
      }
      if (streamError) throw new Error(streamError);
      if (!finished) throw new Error('连接中断，AI 没能给出完整推荐，请重试');
    } catch (e) {
      showError(e.name === 'TypeError'
        ? '无法连接后端服务，请确认 `go run main.go` 正在运行'
        : e.message);
    } finally {
      setLoading(false);
    }
  }
</script>
</body>
</html>
